<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="top-nav">
    <a href="index.html">Google Search</a>
  </div>

  <div class="advanced-wrap">
    <h1>Advanced Search</h1>

    <form action="https://www.google.com/search" method="GET">
      <div class="field-group">

        <div class="field-row">
          <label for="all-words">Find pages with...</label>
          <div class="field-desc"><strong>all these words:</strong></div>
          <input type="text" id="all-words" name="as_q">
        </div>

        <div class="field-row">
          <label for="exact-phrase">Find pages with...</label>
          <div class="field-desc"><strong>this exact word or phrase:</strong></div>
          <input type="text" id="exact-phrase" name="as_epq">
        </div>

        <div class="field-row">
          <label for="any-words">Find pages with...</label>
          <div class="field-desc"><strong>any of these words:</strong></div>
          <input type="text" id="any-words" name="as_oq">
        </div>

        <div class="field-row">
          <label for="none-words">Find pages with...</label>
          <div class="field-desc"><strong>none of these words:</strong></div>
          <input type="text" id="none-words" name="as_eq">
        </div>

      </div>

      <div class="advanced-submit-row">
        <button class="blue-btn" type="submit">Advanced Search</button>
      </div>
    </form>
  </div>

</body>
</html>
